<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="google-site-verification" content="我是費馬工作室，專注於3D網頁介面與使用者體驗設計。" />
		<meta name="viewport" content="width=device-width", initial-scale="1.0", maximum-scale="1.0", user-scalable="no"/>
		<meta name="description" content="我是費馬工作室，專注於3D網頁介面與使用者體驗設計。"/>
		<meta name="keywords" content="設計工作室,3D網頁設計,3D Website Design"/>
		<meta http-equiv="X-UA-Compatible" content="ie=edge"/>
		<title>3D網頁範例| 費馬工作室 | fimawork | 3D網頁設計、3D Website Design</title>
		<link rel="stylesheet" type="text/css" href="Main.css">
		<style type="text/css">
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
			@import url('https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@main/fx_ui.css');

			body
			{
				margin: 0;
				padding:0; 
				background-color: #d6d6d6;
				font-family: 'Inter', sans-serif;
				overflow: hidden;
			}
			
			canvas
			{
				width: 100%;
   				height: 100%;
			}

			#threeContainer {
				position: absolute;
				top: 0; left: 0;
				width: 100%; height: 100%;
				z-index: 6;
			}

		#btnContainer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>
		

	</head>
	
	<body>

		<div id="threeContainer"></div> 

		<!-- 觸發轉場的按鈕 -->
<div id="btnContainer">
    <button class="scene-btn" id="scene_01">香檳金 (Scene 1)</button>
    <button class="scene-btn" id="scene_02">櫻花粉 (Scene 2)</button>
    <button class="scene-btn" id="scene_03">天藍色 (Scene 3)</button>
	<button class="scene-btn" id="scene_04">黑色 (Scene 4)</button>
    <button class="scene-btn" id="scene_05">紫色 (Scene 5)</button>
    <button class="scene-btn" id="scene_06">橘色 (Scene 6)</button>
	<button class="scene-btn" id="scene_07">白色 (Scene 7)</button>
    <button class="scene-btn" id="scene_08">海軍藍 (Scene 8)</button>
</div>
		<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.54/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.54/fx_materials.js';
import * as FXUI from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.54/fx_hud.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { suitcase_2026 } from './models/suitcase_2026_slices.js';
import 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js';
import { Inspector } from 'three/addons/inspector/Inspector.js';

//transition工具
import { uniform, pass } from 'three/tsl';
import { transition } from 'three/addons/tsl/display/TransitionNode.js';
import gsap from 'https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js';


let renderPipeline, transitionPass;
let transition_textureNode;

// 轉場控制 Node (使用 uniform 才能被 GSAP 平滑控制)
const progressNode = uniform(0.0);
const thresholdNode = uniform(0.1);
const useTextureNode = uniform(1);

let camera, renderer, stats, mixer;
let controls;
let threeContainer = document.getElementById("threeContainer");
let scene, scene_02, scene_03, scene_04, scene_05 , scene_06 ,scene_07 , scene_08;

// 宣告場景與 Pass
let pass_01, pass_02, pass_03, pass_04, pass_05, pass_06, pass_07, pass_08;

let isTransitioning = false; // 防連點開關
let currentIndex = 0;        // 記錄當前顯示的場景 (0, 1, 2)

const timer = new THREE.Timer();

const modelPosition=new THREE.Vector3(0,0,0);
const modelRotation=new THREE.Vector3(0,0,0);
const modeScale=1;

const CameraDefaultPos=new THREE.Vector3(0.00,0.635,-2.8);
const ControlsTargetDefaultPos=new THREE.Vector3(0,0.39,0.6);

let main_model= new THREE.Object3D();
let model_02= new THREE.Object3D();
let model_03= new THREE.Object3D();
let model_04= new THREE.Object3D();
let model_05= new THREE.Object3D();
let model_06= new THREE.Object3D();
let model_07= new THREE.Object3D();
let model_08= new THREE.Object3D();

// 2. 用於控制當前與目標 Pass 的動態 Uniform 索引 (0: pass_01, 1: pass_02, 2: pass_03)
const activeIndex_current = uniform(0);
const activeIndex_next = uniform(1);

let dynamicPassCurrent;
let dynamicPassNext;


init();
//FX.Camera_Inspector(camera,controls);
FXUI.InstLoadingEffect_Type_A(true);

async function init()
{
	FX.SetupEnvironment("cloud");

  	scene = new THREE.Scene();
	scene_02= new THREE.Scene();
	scene_03= new THREE.Scene();
	scene_04= new THREE.Scene();
	scene_05= new THREE.Scene();
	scene_06= new THREE.Scene();
	scene_07= new THREE.Scene();
	scene_08= new THREE.Scene();

	scene.background = null;
	scene_02.background = null;
	scene_03.background = null;
	scene_04.background = null;
	scene_05.background = null;
	scene_06.background = null;
	scene_07.background = null;
	scene_08.background = null;


  	camera = new THREE.PerspectiveCamera( 30, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 100 );//非全螢幕比例設定
  	renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
  	renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 1.0;
  	threeContainer.appendChild( renderer.domElement );

	// 建立對應的 PassNode
	pass_01 = pass(scene, camera);
	pass_02 = pass(scene_02, camera);
	pass_03 = pass(scene_03, camera);
	pass_04 = pass(scene_04, camera);
	pass_05 = pass(scene_05, camera);
	pass_06 = pass(scene_06, camera);
	pass_07 = pass(scene_07, camera);
	pass_08 = pass(scene_08, camera);

	// 1. 將所有的 Pass 存入陣列 (Index 分別為 0 ~ 7)
	const allPasses = [
	    pass_01, pass_02, pass_03, pass_04, 
	    pass_05, pass_06, pass_07, pass_08
	];

	//2. 建立動態選擇邏輯的工具函式
	function buildDynamicPass(indexUniform, passes) {
    	let resultNode = passes[passes.length - 1]; // 預設值 (最後一個 Pass)
		
    	// 從倒數第二個倒著組裝 select
    	for (let i = passes.length - 2; i >= 0; i--) {
    	    resultNode = indexUniform.equal(i).select(passes[i], resultNode);
    	}
	
    	return resultNode;
	}

	// TSL 動態選擇 Pass
    dynamicPassCurrent = buildDynamicPass(activeIndex_current, allPasses);

    dynamicPassNext = buildDynamicPass(activeIndex_next, allPasses);
	
	
	// 初始化轉場貼圖 Node
    const loader = new THREE.TextureLoader();
    const transition_texture = loader.load('./textures/transition2.png');
    transition_textureNode = new THREE.TextureNode( transition_texture );

	renderPipeline = new THREE.RenderPipeline( renderer );

	transitionPass = transition(
        dynamicPassCurrent,
        dynamicPassNext,
        transition_textureNode,
        progressNode,
        thresholdNode,
        useTextureNode
    );
	
	// 將 outputNode 永久鎖定在 transitionPass
    renderPipeline.outputNode = transitionPass;
	progressNode.value = 0.0;
	activeIndex_current.value = 0; // 初始場景 0
    activeIndex_next.value = 0; // 靜止時與 A 保持一致

	// 1. 先等待 Renderer 初始化完成
	await renderer.init(); // 記得 r184 一定要加上這行非同步初始化！

  	camera.position.copy(CameraDefaultPos);
  
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
	controls = new OrbitControls( camera, renderer.domElement);
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.maxDistance = 500;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.3;

	controls.maxPolarAngle=FX.ToThreeEulerAngle(95);
	controls.minPolarAngle=FX.ToThreeEulerAngle(-90);
  	controls.update();

  	///hdri 環境光源
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_02);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_03);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_04);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_05);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_06);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_07);
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene_08);

	scene.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_02.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_02.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_03.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_03.environmentRotation.x = FX.ToThreeEulerAngle(30);
	scene_04.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_04.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_05.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_05.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_06.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_06.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_07.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_07.environmentRotation.x = FX.ToThreeEulerAngle(30); 
	scene_08.environmentRotation.y = FX.ToThreeEulerAngle(90); 
	scene_08.environmentRotation.x = FX.ToThreeEulerAngle(30);  
	
	const loader_sucase = new GLTFLoader();
    loader_sucase.setDRACOLoader(FX.dracoLoader);
	loader_sucase.parse(
    FX.Base64ToArrayBuffer(suitcase_2026()),
    '',
    (gltf) => {
        
		const model = gltf.scene;

		model.position.set(0,0,0);
		model.rotation.set(0,0, 0);
		model.scale.set(modeScale,modeScale,modeScale);

		const champagne_housing_material=FXM.InstEtchingMaterial(0xEEEBD3,0.3,0.5,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const pink_housing_material=FXM.InstEtchingMaterial(0xFE90BC,0.3,0.5,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const blue_housing_material=FXM.InstEtchingMaterial(0xdbf7ff,0.3,0.5,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const black_housing_material=FXM.InstEtchingMaterial(0x484747,0.278,0.5,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const purple_housing_material=FXM.InstEtchingMaterial(0xF3B4F1,0.5,0.22,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const orange_housing_material=FXM.InstEtchingMaterial(0xFF8566,0.509,0.634,0.3000000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const white_housing_material=FXM.InstEtchingMaterial(0xF5F4EF,0.5,0.307,0.3000000000000002,false,1,"./textures/Light_Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const blueNavy_housing_material=FXM.InstEtchingMaterial(0x4B5A86,0.413,0.432,0.6820000000000002,false,1,"./textures/Gravel.png",new THREE.Vector2(0,0),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		const casterMount_material=FXM.InstEtchingMaterial(0x363636,0.35,0.5,0.7500000000000001,false,1,"./textures/Gravel.png",new THREE.Vector2(100,100),new THREE.Vector2(0,0),"./textures/Gravel.png",new THREE.Vector2(300,300),6);

		model.traverse( function ( object ) {	
                  
            if(object.name.includes("housing"))
            {
              FX.ReturnBufferGeometry(object,champagne_housing_material,main_model,scene);
            }

			if(object.name.includes("rubber"))
            {
              FX.ReturnBufferGeometry(object,null,main_model,scene);
            }

			if(object.name.includes("padding"))
            {
              FX.ReturnBufferGeometry(object,casterMount_material,main_model,scene);
            }

        });

		main_model.add(model);
		scene.add(main_model);
		model_02=main_model.clone();
		model_03=main_model.clone();
		model_04=main_model.clone();
		model_05=main_model.clone();
		model_06=main_model.clone();
		model_07=main_model.clone();
		model_08=main_model.clone();

		model_02.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,pink_housing_material,model_02,scene);
            }

        });

		model_03.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,blue_housing_material,model_03,scene);
            }

        });

		model_04.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,black_housing_material,model_04,scene);
            }

        });

		model_05.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,purple_housing_material,model_05,scene);
            }

        });

		model_06.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,orange_housing_material,model_06,scene);
            }

        });

		model_07.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,white_housing_material,model_07,scene);
            }

        });

		model_08.traverse( function ( object ) {	
                  
            if(object.name.includes("BufferGeometry_housing"))
            {
              FX.ReturnBufferGeometry(object,blueNavy_housing_material,model_08,scene);
            }

        });

		scene_02.add(model_02);
		scene_03.add(model_03);
		scene_04.add(model_04);
		scene_05.add(model_05);
		scene_06.add(model_06);
		scene_07.add(model_07);
		scene_08.add(model_08);

		setTimeout(() => {
			// 2. 模型套用新材質與生成後，再啟動動畫循環（避免出現黑色模型）
			renderer.setAnimationLoop( animate );
			FXUI.InstLoadingEffect_Type_A(false);
			//FX.Hierarchy(main_model,camera,scene,renderer,controls); 
		}, 1000);

    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///EventListener
  	window.addEventListener( 'resize', onWindowResize );  

	
    document.getElementById("scene_01").addEventListener('click', () => {transitionToScene(0);});

	document.getElementById("scene_02").addEventListener('click', () => {transitionToScene(1);});

	document.getElementById("scene_03").addEventListener('click', () => {transitionToScene(2);});

	document.getElementById("scene_04").addEventListener('click', () => {transitionToScene(3);});

	document.getElementById("scene_05").addEventListener('click', () => {transitionToScene(4);});

	document.getElementById("scene_06").addEventListener('click', () => {transitionToScene(5);});

	document.getElementById("scene_07").addEventListener('click', () => {transitionToScene(6);});

	document.getElementById("scene_08").addEventListener('click', () => {transitionToScene(7);});


}


function onWindowResize() 
{
    camera.aspect = threeContainer.clientWidth/threeContainer.clientHeight;//非全螢幕比例設定
	camera.updateProjectionMatrix();
    renderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight);
}

function animate(timestamp) 
{
  	controls.update();

    renderPipeline.render();

  	// 自動更新時間（用來計算移動速度、旋轉等）
    timer.update( timestamp );
	const delta = timer.getDelta();

	if ( mixer ) mixer.update( delta );
}

function transitionToScene(targetIndex) {
    if (isTransitioning || targetIndex === currentIndex) return; // 避免動畫過程重複觸發
    isTransitioning = true;

	gsap.killTweensOf(
        progressNode
    );

	// 鎖定起點與目標 Uniform
    activeIndex_current.value = currentIndex;
    activeIndex_next.value = targetIndex;
	 
	// TransitionNode 的方向是反的
    // progress = 1 → A（原本）
    // progress = 0 → B（目標）
	progressNode.value = 1.0;

	renderPipeline.render();

    gsap.to(progressNode, {
        value: 0.0,
        duration: 1.5,
        ease: 'power2.inOut',
        onComplete: () => {
            // 轉場完成：更新當前場景索引
            currentIndex = targetIndex;
			activeIndex_current.value = targetIndex;

			progressNode.value = 0.0;
			isTransitioning = false;

            console.log(`轉場成功！目前顯示 Scene ${currentIndex + 1}`);
        }
    });
}

		</script>
    </body>

</html>
