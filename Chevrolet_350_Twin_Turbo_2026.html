<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width", initial-scale="1.0", maximum-scale="1.0", user-scalable="no"/>
		<meta http-equiv="X-UA-Compatible" content="ie=edge"/>
		<title>Chevrolet 350 Twin Turbo</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
		<style type="text/css">

			:root {
				--accent-color: #ffffff;
				--accent-glow: rgba(255, 59, 48, 0.5);
				--panel-bg: rgba(10, 10, 10, 0.18);
				--border-color: rgba(255, 255, 255, 0.1);
				--text-main: #ffffff;
				--text-dim: rgba(255, 255, 255, 0.6);
			}
			
			body
			{
				margin: 0;
				padding:0; 
				background-color: #050505;
				color: var(--text-main);
				font-family: 'Inter', sans-serif;
				overflow: hidden;
			}
			
			canvas
			{
				width: 100%;
    			height: 100%;
				display: block;
			}
			
			#threeContainer
			{
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1;
			}

			/* UI Overlay */
			#ui-overlay {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 10;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 30px;
				box-sizing: border-box;
				pointer-events: none;
			}

			/* Header */
			.header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
			}

			.title-group h1 {
				margin: 0;
				font-family: 'Space Mono', monospace;
				font-size: 1.8rem;
				letter-spacing: 2px;
				text-transform: uppercase;
				color: var(--text-main);
			}

			.title-group .subtitle {
				font-size: 0.8rem;
				color: var(--accent-color);
				letter-spacing: 4px;
				text-transform: uppercase;
				margin-top: 5px;
			}

			.system-status {
				text-align: right;
				font-family: 'Space Mono', monospace;
				font-size: 0.7rem;
				color: var(--text-dim);
			}

			.status-blink {
				display: inline-block;
				width: 8px;
				height: 8px;
				background: var(--accent-color);
				border-radius: 50%;
				margin-right: 8px;
				box-shadow: 0 0 10px var(--accent-glow);
				animation: blink 1.5s infinite;
			}

			@keyframes blink {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.3; }
			}

			/* Bottom Control Bar */
			.bottom-bar {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 15px;
				pointer-events: fill;
			}

			.control-deck {
				width: 600px;
				background: var(--panel-bg);
				backdrop-filter: blur(15px);
				border: 1px solid var(--border-color);
				padding: 20px 40px;
				border-radius: 4px;
				display: flex;
				flex-direction: column;
				gap: 15px;
			}

			.slider-header {
				display: flex;
				justify-content: space-between;
				font-family: 'Space Mono', monospace;
				font-size: 0.7rem;
				color: var(--text-dim);
				text-transform: uppercase;
			}

			#scrubber {
				-webkit-appearance: none;
				width: 100%;
				height: 4px;
				background: rgba(255, 255, 255, 0.1);
				outline: none;
				border-radius: 2px;
			}

			#scrubber::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 20px;
				height: 20px;
				background: var(--accent-color);
				cursor: pointer;
				border-radius: 50%;
				box-shadow: 0 0 15px var(--accent-glow);
				border: 4px solid #111;
			}

			/* Logos */
			.fimawork_logo {
				position: static; /* Moved inside UI overlay grid */
				height: 24px;
				aspect-ratio: 192/33;
				background-image: url(./images/fimawork_logo_C_white.png);
				background-size: contain;
				background-repeat: no-repeat;
				opacity: 0.8;
				transition: opacity 0.3s;
				cursor: pointer;
			}

			.fimawork_logo:hover {
				opacity: 1;
			}

			#loadingUI
			{
				position: fixed;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background: #050505;
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 1000;
				transition: opacity 0.8s ease-out;
			}

			.loading-spinner {
				width: 80px;
				height: 80px;
				border: 2px solid rgba(255, 59, 48, 0.1);
				border-top: 2px solid var(--accent-color);
				border-radius: 50%;
				animation: spin 1s linear infinite;
				position: relative;
			}

			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}

			.web3d_icon
			{
				position: absolute;
				bottom: 30px;
				right: 30px;
				width: 40px;
				height: 40px;
				background-image: url(./images/web3d_icon_white.png);
				background-size: contain;
				opacity: 0.3;
			}

			/* Hotspots */
			.hotspot {
				position: absolute;
				width: 0.8rem;
				height: 0.8rem;
				background: rgba(255, 255, 255, 0.3);
				border: 2px solid #fff;
				border-radius: 50%;
				cursor: pointer;
				z-index: 150;
				display: flex;
				justify-content: center;
				align-items: center;
				transition: transform 0.3s ease, background 0.3s ease;
			}

			.hotspot::after {
				content: '';
				position: absolute;
				width: 100%;
				height: 100%;
				border-radius: 50%;
				border: 1px solid #fff;
			}

			.hotspot:hover {
				transform: scale(1.3);
				background: #fff;
			}


			.hotspot-label {
				position: absolute;
				left: 25px;
				top: 50%;
				transform: translateY(-50%);
				padding: 5px 12px;
				white-space: nowrap;
				font-family: 'Space Mono', monospace;
				font-size: 0.75rem;
				color: #fff;
				pointer-events: none;
			}

		</style>
		<script type="importmap">
			{
			  "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
			  }
			}
		</script>

	</head>
	
	<body>
		<div id="threeContainer"></div> 
		
		<div id="loadingUI">
			<div class="loading-spinner"></div>
		</div>

		<div id="ui-overlay">
			<header class="header">
				<div class="title-group">
					<h1>CHEVROLET 350</h1>
					<div class="subtitle">TWIN TURBO V8 PERFORMANCE</div>
				</div>
				<div class="system-status">
					<span class="status-blink"></span>
					SYSTEM ACTIVE / DIAGNOSTICS OK
				</div>
			</header>

			<footer class="bottom-bar">
				<div class="control-deck">
					<div class="slider-header">
						<span>Exploded View Analysis</span>
						<span id="scrubber-value">0%</span>
					</div>
					<input id="scrubber" type="range" value="0">
				</div>
				<div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
					<div class="fimawork_logo" onclick="window.open('https://fimawork.tw/')"></div>
					<div style="font-size: 0.6rem; color: var(--text-dim); font-family: 'Space Mono', monospace;">
						DESIGNED FOR PERFORMANCE SHOWCASE © 2026
					</div>
				</div>
			</footer>
		</div>

		<div class="web3d_icon"></div>
		
		<script type="module">

import * as THREE from 'three';

import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.0/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.0/fx_materials.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { Chevrolet_350_Twin_Turbo_2026 } from './models/Chevrolet_350_Twin_Turbo_2026_slices.js';


let scene, camera, renderer, stats, mixer;
let composer;
let controls;
let threeContainer = document.getElementById("threeContainer");
let _loadingUI = document.getElementById("loadingUI");

let labelRenderer;

const clock = new THREE.Clock();

const CameraDefaultPos=new THREE.Vector3(-78.788,39.045,-56.125);
const ControlsTargetDefaultPos=new THREE.Vector3(-1.371,-0.164,-6.010);
let EngineModule;

//////Raycaster工具//////
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let INTERSECTED;

let labels=[];
let isLabelOn=false;

let parts_num=0;

init();
//FX.Camera_Inspector(camera,controls);
FX.InputEventListener(threeContainer);

function init()
{
	FX.SetupEnvironment("cloud");

  	scene = new THREE.Scene();

  	camera = new THREE.PerspectiveCamera( 25, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000 );//非全螢幕比例設定
  	renderer = new THREE.WebGLRenderer({ antialias: true});
  	renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);

  	renderer.setClearColor(0x000000, 0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 0.9;
  	//document.body.appendChild( renderer.domElement );
  	threeContainer.appendChild( renderer.domElement );

	labelRenderer = new CSS2DRenderer();
	labelRenderer.setSize( window.innerWidth , window.innerHeight );
	labelRenderer.domElement.style.position = 'absolute';
	labelRenderer.domElement.style.top = '0px';
	threeContainer.appendChild( labelRenderer.domElement );

  	camera.position.copy(CameraDefaultPos);
  
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
  	controls = new OrbitControls( camera, labelRenderer.domElement );
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.maxDistance =400;
	//controls.minDistance = 60;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.3;
  	controls.update();

	FX.posData[0]={ camera_pos:CameraDefaultPos, controlsTarget_pos:ControlsTargetDefaultPos};

	//side view
	FX.posData[1]={ camera_pos:new THREE.Vector3(-101.494,2.804,-8.978), controlsTarget_pos:new THREE.Vector3(-1.371,-0.164,-6.010)};
  	//front view
  	FX.posData[2]={ camera_pos:new THREE.Vector3(-0.157,32.281,-114.339), controlsTarget_pos:new THREE.Vector3(-1.371,0,-6.010)};
  	//top view
  	FX.posData[3]={ camera_pos:new THREE.Vector3(-1.371,94.893,-6.010), controlsTarget_pos:new THREE.Vector3(-1.371,-0.001,-6.010)};

  	///hdri 環境光源
	FX.LoadHDRWithPMREM('./textures/hdri/studio_small_09_2k.hdr',scene,renderer);

	
	scene.background = new THREE.Color(0x333333);

	const loader_FW_0004_Signboard = new GLTFLoader();
    loader_FW_0004_Signboard.setDRACOLoader(FX.dracoLoader);
	loader_FW_0004_Signboard.parse(
    FX.Base64ToArrayBuffer(Chevrolet_350_Twin_Turbo_2026()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		const newScale=0.25;
		model.scale.set(newScale,newScale,newScale);

		const redHousing_material=FXM.InstEtchingMaterial(0xFF3838,0.3,0.9,0.49999999999999983,false,1,"./textures/Light_Gravel.png",new THREE.Vector2(10,10),new THREE.Vector2(0,0),"./textures/Light_Gravel.png",new THREE.Vector2(50,50),1);

		const SandTextureMatel_material=FXM.InstEtchingMaterial(0xC2C2C2,0.3,0.9,1,false,1,"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(100,100),new THREE.Vector2(0,0),"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(100,100),100);
		
		const blueTube_material=FXM.InstMaterial(0x0942C8,0.5,0.5,0,2.3333333333333335,1,false,1,true);
		const fanWheel_material=FXM.InstMaterial(0x954EB7,1,0.3,0,1,0,false,1,true);
		const heatSink_material=FXM.InstEtchingMaterial(0xCCCCCC,0.1,1,1,false,1,"./textures/Light_Gravel.png",new THREE.Vector2(10,10),new THREE.Vector2(0,0),"./textures/Light_Gravel.png",new THREE.Vector2(50,50),1);

		const axle_material=FXM.InstMaterial(0x9B9292,0.36,1,0,2.3333333333333335,1,false,1,true);
		const belt_material=FXM.InstMaterial(0x3D3D3D,0.3,0.5,1,1,0,false,1,true);
		const rack_material=FXM.InstMaterial(0x1F1F1F,0.5,0.75,1,2.3333333333333335,1,false,1,true);

		model.traverse( function ( object ) {	
                  
            if(object.name.includes("red_housing"))
            {
				parts_num++;
				object.material=redHousing_material.clone();	 
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }	

			if(object.name.includes("SandTextureMatel"))
            {
				parts_num++;
				object.material=SandTextureMatel_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("fanWheel"))
            {
				parts_num++;
				object.material=fanWheel_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("blueTube"))
            {
				parts_num++;
				object.material=blueTube_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("heatSink"))
            {
				parts_num++;
				object.material=heatSink_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("axle"))
            {
				parts_num++;
				object.material=axle_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("belt"))
            {
				parts_num++;
				object.material=belt_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }

			if(object.name.includes("rack"))
            {
				parts_num++;
				object.material=rack_material.clone();
				InstSceneBtn("hotspot","hotspot-label",object,`Engine Parts ${parts_num}`);
            }
			
        })

		EngineModule=model;

		animate();
		scene.add(model);

		setTimeout(() => {
			_loadingUI.style.opacity = '0';
			setTimeout(() => {
				_loadingUI.remove();
			}, 800);
		}, 600);

		//FX.Material_Inspector(scene);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	scene.environmentRotation.y = FX.ToThreeEulerAngle(0); 


	

	setupControls(); 

	function setupControls() 
	{
		const scrubber = document.getElementById( 'scrubber' );
		const scrubberValue = document.getElementById( 'scrubber-value' );
		scrubber.max = 100;
		scrubber.min = 0;

		scrubber.addEventListener( 'input', function (event) {

			scrubberValue.textContent = `${event.target.value}%`;
			
			if(event.target.value>50&&!isLabelOn)
			{
				ShowLabel(true);
			}

			if(event.target.value<=50&&isLabelOn)
			{
				ShowLabel(false);
			}
			

			EngineModule.traverse( function ( object ) {	
                  
            	if(object.name.includes("part"))
            	{
					for(let i=0;i<object.children.length;i++)
					{
						ExplodeEffect(object.children[i],new THREE.Vector3(0,0,0),0.015*event.target.value);
					}
            	}	

				if(object.name.includes("screw"))
            	{
					for(let i=0;i<object.children.length;i++)
					{
						ExplodeEffect(object.children[i],new THREE.Vector3(0,0,0),0.015*event.target.value);
					}
            	}
        	})

			

		} );
	}

	///EventListener
  	window.addEventListener( 'resize', onWindowResize );  

	window.addEventListener('pointermove', (event) => {
    
		//////Raycast工具/////
		if(EngineModule.children.length>0)
		{
			RaycastFunction(event);
		}
	
    });

}


function onWindowResize() 
{
    camera.aspect = threeContainer.clientWidth/threeContainer.clientHeight;//非全螢幕比例設定
	camera.updateProjectionMatrix();
    renderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight);
	labelRenderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight );
}

function animate() 
{
  	requestAnimationFrame( animate );

  	controls.update();
  	renderer.render( scene, camera );
	labelRenderer.render( scene, camera );

	const delta = clock.getDelta();

	if ( mixer ) mixer.update( delta );

	FX.UpdateCameraPosition(camera,controls);

}

function ExplodeEffect(target,center,ratio)
{
	let default_position=FX.ReturnModelCenter(target);
	let new_position;

	new_position=new THREE.Vector3(center.x+(default_position.x-center.x)*ratio,center.y+(default_position.y-center.y)*ratio,center.z+(default_position.z-center.z)*ratio);

	target.position.set(new_position.x,new_position.y,new_position.z);
}


function RaycastFunction(event)
{
	

	pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
	pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

			// update the picking ray with the camera and pointer position
	raycaster.setFromCamera( pointer, camera );

	const intersects = raycaster.intersectObjects( EngineModule.children);

	if ( intersects.length > 0 ) 
	{
		if ( INTERSECTED != intersects[ 0 ].object ) 
		{
			INTERSECTED = intersects[ 0 ].object;
			console.log(INTERSECTED);
			FocusMode(INTERSECTED);

			if(!isLabelOn)
			{
				ShowLabel(false);
				INTERSECTED.children[0].visible=true;
			}
		}
	} 

	else 
	{
		INTERSECTED = null;

		for(let i=0;i<EngineModule.children.length;i++)
		{    
		    FX.SafeTraverse(EngineModule.children[i], (object) => {
			
		      if(object.isMesh)
		      {
		        if(object.isMesh)
    			{
    			  object.material.opacity=1;
    			  object.material.transparent=false;
    			  object.material.needsUpdate = true;
    			}
		      }
		  
		    }); 
		}

		if(!isLabelOn)
		{
			ShowLabel(false);
		}
	}
}


function FocusMode(target)
{
	if(INTERSECTED!=null)
	{
		for(let i=0;i<EngineModule.children.length;i++)
		{    
		    FX.SafeTraverse(EngineModule.children[i], (object) => {
				
		      if(object.isMesh)
		      {
		        object.material.opacity=0.3;
		        object.material.transparent=true;
		        object.material.needsUpdate = true;
		      }
		    }); 
		}

		target.material.opacity=1;
    	target.material.transparent=false;
    	target.material.needsUpdate = true;
	}		
}


function InstSceneBtn(thisMainCSS,thisSubCSS,thisLabelTarget,thisContent)
{
	const MainDiv = document.createElement( 'div' );
	MainDiv.className = thisMainCSS;

	const SubDiv = document.createElement( 'div' );
	SubDiv.className = thisSubCSS;
	SubDiv.textContent=thisContent;
	MainDiv.append(SubDiv);

	let label_position=FX.ReturnModelCenter(thisLabelTarget);
  
	const Label = new CSS2DObject( MainDiv );
	Label.position.set( label_position.x,label_position.y,label_position.z);
	Label.center.set( 0.5, 0.5 );
	thisLabelTarget.attach( Label );
	Label.layers.set( 0 );
	Label.name="sceneButton";
	Label.visible=false;

	labels.push(Label);

	MainDiv.addEventListener("pointermove", (event) => {

		INTERSECTED=thisLabelTarget;
		FocusMode(thisLabelTarget);
 		   	///不執行頁面縮放 
	  	event.preventDefault();
	  	event.stopPropagation();

	});
}

function ShowLabel(on)
{
	for(let i=0;i<labels.length;i++)
	{
		labels[i].visible=on;
	}

	isLabelOn=on;
}

		</script>
    </body>

</html>
