<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="google-site-verification" content="我是費馬工作室，專注於3D網頁介面與使用者體驗設計。" />
		<meta name="viewport" content="width=device-width", initial-scale="1.0", maximum-scale="1.0", user-scalable="no"/>
		<meta name="description" content="我是費馬工作室，專注於3D網頁介面與使用者體驗設計。"/>
		<meta name="keywords" content="設計工作室,3D網頁設計,3D Website Design"/>
		<meta http-equiv="X-UA-Compatible" content="ie=edge"/>
		<title>3D網頁範例| 費馬工作室 | fimawork | 3D網頁設計、3D Website Design</title>
		<link rel="stylesheet" type="text/css" href="Main.css">
		<style type="text/css">
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
			@import url('https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@main/fx_ui.css');

			body
			{
				margin: 0;
				padding:0; 
				background-color: #d6d6d6;
			}
			
			canvas
			{
				width: 100%;
   				height: 100%;
			}

			#threeContainer {
				position: absolute;
				top: 0; left: 0;
				width: 100%; height: 100%;
				z-index: 6;
			}


		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>

	</head>
	
	<body>
	

		<div id="threeContainer"></div> 
	

		<script type="module">

import * as THREE from 'three';

import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.56/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.56/fx_materials.js';
import * as FXUI from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@2.56/fx_hud.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { CoffeeMachine_2026 } from './models/CoffeeMachine_2026_slices.js';
import { Inspector } from 'three/addons/inspector/Inspector.js';


let scene, camera, renderer, stats, mixer;

let controls;
let threeContainer = document.getElementById("threeContainer");


const timer = new THREE.Timer();

const modelPosition=new THREE.Vector3(0,0,0);
const modelRotation=new THREE.Vector3(0,FX.ToThreeEulerAngle(90), 0);
const modeScale=10;

const CameraDefaultPos=new THREE.Vector3(-10.157,4.267,-4.991);
const ControlsTargetDefaultPos=new THREE.Vector3(-0.087,1.503,-0.211);

let main_model= new THREE.Object3D();

let idleTime=0;
const hold_time=6;


init();
//FX.Camera_Inspector(camera,controls);
FXUI.InstLoadingEffect_Type_A(true);

async function init()
{
	FX.SetupEnvironment("cloud");

  	scene = new THREE.Scene();
	scene.background = null;

  	camera = new THREE.PerspectiveCamera( 24, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000 );//非全螢幕比例設定
  	renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
  	renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 1.0;
  	//document.body.appendChild( renderer.domElement );
  	threeContainer.appendChild( renderer.domElement );

	//renderer.inspector = new Inspector();

	// 1. 先等待 Renderer 初始化完成
	await renderer.init(); // 記得 r184 一定要加上這行非同步初始化！

  	camera.position.copy(CameraDefaultPos);
  
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
	controls = new OrbitControls( camera, renderer.domElement);
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.maxDistance = 500;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.3;

	controls.maxPolarAngle=FX.ToThreeEulerAngle(95);
	controls.minPolarAngle=FX.ToThreeEulerAngle(-90);
  	controls.update();

  	///hdri 環境光源
	FX.LoadUltraHDRForWebGPU('./textures/hdri/brown_photostudio_02_1k.jpg',scene);
	scene.environmentRotation.y = FX.ToThreeEulerAngle(-60); 
	scene.environmentRotation.z = FX.ToThreeEulerAngle(15); 
	
	const loader_CoffeeMachine = new GLTFLoader();
    loader_CoffeeMachine.setDRACOLoader(FX.dracoLoader);
	loader_CoffeeMachine.parse(
    FX.Base64ToArrayBuffer(CoffeeMachine_2026()),
    '',
    (gltf) => {
        
		const model = gltf.scene;

		model.position.set(0,0,0);
		model.rotation.set(0,FX.ToThreeEulerAngle(-90), 0);
		model.scale.set(modeScale,modeScale,modeScale);

		const tank_material=FXM.InstMaterial(0xFFFFFF,0,0.528,0.894,2.4,1,true,1,true);
		const screen_material=FXM.InstMaterial(0xFFFFFF,0,0.346,1,1,0,true,1,false);
		const black_plastic_material=FXM.InstMaterial(0x1A1A1A,0.461,0.5,0,1.5,0.5,false,1,true);
		const handlebar_material=FXM.InstMaterial(0x000000,0.413,0,0,1.5,0.5,false,1,true);
		const brush_stainless_material=FXM.InstEtchingMaterial(0xFFFFFF,0.3,1,0,false,1,"./textures/Light%20scratches.png",new THREE.Vector2(1,9),new THREE.Vector2(0,0),"./textures/Heavy%20scratches.png",new THREE.Vector2(1,15),0.3);
		const brush_stainless_02_material=FXM.InstEtchingMaterial(0xFFFFFF,0.3,1,0,false,1,"./textures/Light%20scratches.png",new THREE.Vector2(1,3),new THREE.Vector2(0,0),"./textures/Heavy%20scratches.png",new THREE.Vector2(1,2),0.3);
		const PressureGauge_material=FXM.InstEmissiveBasicMaterial(0xffffff,1.0)

		const polish_plate_material=FXM.InstMaterial(0xDBDBDB,0.15,1,0,2.2509752925877766,0.9620000000000002,false,1,true);
		const stainlessSteel_material=FXM.InstMaterial(0xDEDFDD,0.01,1,0,1,0,false,1,true);

		const radial_brush_material=FXM.InstEtchingMaterial(0xC2C2C2,0.75,1,1,false,1,"./textures/Radial_Brush_01.jpg",new THREE.Vector2(1,1),new THREE.Vector2(0,0),"./textures/Radial_Brush_01.jpg",new THREE.Vector2(1,1),0);

		model.traverse( function ( object ) {	
                  
            if (object.name.includes("Tank")) FX.ReturnBufferGeometry(object, tank_material, model, scene);
			if (object.name.includes("BlackPlastic")) FX.ReturnBufferGeometry(object, black_plastic_material, model, scene);
			if (object.name.includes("HandleBar")) FX.ReturnBufferGeometry(object, handlebar_material, model, scene);
			if (object.name.includes("ElectroplatingTop")) FX.ReturnBufferGeometry(object, brush_stainless_material, model, scene);
			if (object.name.includes("ElectroplatingBase")) FX.ReturnBufferGeometry(object, brush_stainless_02_material, model, scene);
			if (object.name.includes("TopTray")) FX.ReturnBufferGeometry(object,polish_plate_material, model, scene);
			if (object.name.includes("BottomTray")) FX.ReturnBufferGeometry(object, polish_plate_material, model, scene);
			if (object.name.includes("GroupHead")) FX.ReturnBufferGeometry(object, stainlessSteel_material, model, scene);
			if (object.name.includes("SteamWand")) FX.ReturnBufferGeometry(object, stainlessSteel_material, model, scene);
			if (object.name.includes("MainBottom")) FX.ReturnBufferGeometry(object, null, model, scene);
			if (object.name.includes("Screen")) FX.ReturnBufferGeometry(object, screen_material, model, scene);
			if (object.name==="Inner_A") FX.ReturnBufferGeometry(object, stainlessSteel_material, model, scene);
			if (object.name==="Inner_B") FX.ReturnBufferGeometry(object, stainlessSteel_material, model, scene);
			if (object.name==="Inner_C") FX.ReturnBufferGeometry(object, stainlessSteel_material, model, scene);
			if (object.name==="PressureGauge") FX.ReturnBufferGeometry(object, PressureGauge_material, model, scene);
			if (object.name==="Gauge") FX.ReturnBufferGeometry(object, null, model, scene);
			if (object.name.includes("Knob")) FX.ReturnBufferGeometry(object, polish_plate_material, model, scene);
			if (object.name.includes("Tooth")) FX.ReturnBufferGeometry(object, polish_plate_material, model, scene);
			if (object.name.includes("Dish")) FX.ReturnBufferGeometry(object, radial_brush_material, model, scene);
        })

		scene.add(main_model);
		scene.add(model);
		
		setTimeout(() => {
			// 2. 模型套用新材質與生成後，再啟動動畫循環（避免出現黑色模型）
			renderer.setAnimationLoop( animate );
			FXUI.InstLoadingEffect_Type_A(false);
			//FX.Hierarchy(model,camera,scene,renderer,controls) 
		}, 1000);

    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);


	const power_icon_geometry = new THREE.PlaneGeometry();
	const power_icon_material=FXM.InstHUDMaterial('./images/Power_001_white.png',0x000000,2,true,0.9);
	const power_icon = new THREE.Mesh( power_icon_geometry, power_icon_material );
	power_icon.position.set(-1.6057, 2.4891, -0.5529);
	power_icon.scale.set(0.06,0.06,0.06);
	power_icon.rotation.x = FX.ToThreeEulerAngle(90); 
	power_icon.rotation.y = FX.ToThreeEulerAngle(82); 
	power_icon.rotation.z = FX.ToThreeEulerAngle(-90); 

	const cup_icon_geometry = new THREE.PlaneGeometry();
	const cup_icon_material=FXM.InstHUDMaterial('./images/Coffee_001_black.png',0x000000,2,true,0.9);
	const cup_icon = new THREE.Mesh( cup_icon_geometry, cup_icon_material );
	cup_icon.position.set(-1.5889, 2.6089, 0.5572);
	cup_icon.scale.set(0.06,0.06,0.06);
	cup_icon.rotation.x = FX.ToThreeEulerAngle(90); 
	cup_icon.rotation.y = FX.ToThreeEulerAngle(82); 
	cup_icon.rotation.z = FX.ToThreeEulerAngle(-90); 

	const steamWand_icon_geometry = new THREE.PlaneGeometry();
	const steamWand_icon_material=FXM.InstHUDMaterial('./images/SteamWand_001_black.png',0x000000,2,true,0.9);
	const steamWand_icon = new THREE.Mesh( steamWand_icon_geometry, steamWand_icon_material );
	steamWand_icon.position.set(-1.6237, 2.3616, 0.5572);
	steamWand_icon.scale.set(0.06,0.06,0.06);
	steamWand_icon.rotation.x = FX.ToThreeEulerAngle(90); 
	steamWand_icon.rotation.y = FX.ToThreeEulerAngle(82); 
	steamWand_icon.rotation.z = FX.ToThreeEulerAngle(-90); 

	const pressureGauge_icon_geometry = new THREE.PlaneGeometry();
	const pressureGauge_icon_material=FXM.InstHUDMaterial('./images/PressureGauge_001-01.png',0xcfcfcf,1,true,1.0);
	const pressureGauge_icon = new THREE.Mesh( pressureGauge_icon_geometry, pressureGauge_icon_material );
	pressureGauge_icon.position.set(-1.5982, 2.6001, 0.0003);
	pressureGauge_icon.scale.set(0.46,0.46,0.46);
	pressureGauge_icon.rotation.x = FX.ToThreeEulerAngle(-90); 
	pressureGauge_icon.rotation.y = FX.ToThreeEulerAngle(-82); 
	pressureGauge_icon.rotation.z = FX.ToThreeEulerAngle(-90); 
	pressureGauge_icon.renderOrder = 1;//避免被玻璃遮住

	const switch_icon_geometry = new THREE.PlaneGeometry();
	const switch_icon_material=FXM.InstHUDMaterial('./images/Switch_001_white.png',0x000000,1,true,0.9);
	const switch_icon = new THREE.Mesh( switch_icon_geometry, switch_icon_material );
	switch_icon.position.set(-0.2317, 2.5303, 1.0249);
	switch_icon.scale.set(0.6,0.6,0.6);
	switch_icon.rotation.x = FX.ToThreeEulerAngle(-2.7); 
	switch_icon.rotation.y = FX.ToThreeEulerAngle(0); 
	switch_icon.rotation.z = FX.ToThreeEulerAngle(0); 

	scene.add(power_icon).add(cup_icon).add(steamWand_icon).add(pressureGauge_icon).add(switch_icon);

	//FX.Hierarchy(pressureGauge_icon,camera,scene,renderer,controls) 

	//影子工具
	FX.InitWebGPUShadow(scene, {
     shadow: { blur: 0.5, darkness: 0.25 },
     plane: { color: '#ffffff', opacity: 1 }
});


	///EventListener
  	window.addEventListener( 'resize', onWindowResize );  

  		window.addEventListener("pointerdown", (event) => {
		
		idleTime=0;
		controls.autoRotate=false;
	
	});

	window.addEventListener( 'pointermove', function(e) {
		
		idleTime=0;
		controls.autoRotate=false;
		
	});

  	window.addEventListener("wheel", (event) => {
		
		idleTime=0;
		controls.autoRotate=false;
		
	});
	
}


function onWindowResize() 
{
    camera.aspect = threeContainer.clientWidth/threeContainer.clientHeight;//非全螢幕比例設定
	camera.updateProjectionMatrix();
    renderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight);
}

function animate(timestamp) 
{

  	controls.update();
  	renderer.render( scene, camera );

  	// 自動更新時間（用來計算移動速度、旋轉等）
    timer.update( timestamp );
	const delta = timer.getDelta();


	if ( mixer ) mixer.update( delta );

//	idleTime+=delta;
//	
//	if(idleTime>hold_time)
//	{
//		controls.autoRotate=true;
//	}


//影子工具
FX.UpdateWebGPUShadow(renderer, scene);

}





		</script>
    </body>

</html>
