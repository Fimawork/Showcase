		<link rel="stylesheet" type="text/css" href="Main.css">
		<style type="text/css">
			@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');


			body
			{
				margin: 0;
				padding:0; 
				background: radial-gradient(circle at 40% 50%, #1a2a47 0%, #080d1a 100%);
				height: 100vh;
				width: 100vw;
				overflow: hidden;
				display: flex;
				justify-content: center;
				align-items: center;
				color: #fff;
				font-family: 'Outfit', sans-serif;
			}
			
			canvas
			{
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			/* Background Watermark */
			.bg-watermark {
				position: absolute;
				left: 2%;
				top: 50%;
				transform: translateY(-50%) rotate(-90deg);
				font-size: 18vh;
				font-weight: 900;
				color: rgba(255, 255, 255, 0.03);
				white-space: nowrap;
				user-select: none;
				z-index: 1;
				letter-spacing: -5px;
				pointer-events: none;
				text-transform: uppercase;
			}

			/* Sidebar Specs */
			.sidebar-specs {
				position: absolute;
				right: 5%;
				top: 50%;
				transform: translateY(-50%);
				display: flex;
				flex-direction: column;
				gap: 40px;
				z-index: 100;
				animation: fadeInSlideLeft 1s ease-out;
			}

			.spec-item {
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 8px;
				animation: staggerFadeIn 0.8s ease-out both;
			}

			.spec-item:nth-child(1) { animation-delay: 0.2s; }
			.spec-item:nth-child(2) { animation-delay: 0.4s; }
			.spec-item:nth-child(3) { animation-delay: 0.6s; }

			.spec-icon {
				font-size: 1.5rem;
				opacity: 0.8;
			}

			.spec-label {
				font-size: 0.75rem;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: rgba(255, 255, 255, 0.6);
			}

			.spec-value {
				font-size: 1.1rem;
				font-weight: 400;
			}

			/* Product Intro */
			.product-intro {
				position: absolute;
				left: 8%;
				bottom: 12%;
				max-width: 320px;
				z-index: 100;
				animation: fadeInUp 1s ease-out 0.5s both;
			}

			.intro-title {
				font-size: 3rem;
				font-weight: 700;
				margin-bottom: 15px;
				line-height: 1;
				background: linear-gradient(180deg, #fff 0%, #aaa 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			.intro-desc {
				font-size: 1rem;
				font-weight: 300;
				line-height: 1.6;
				color: rgba(255, 255, 255, 0.6);
			}

			/* Floating Orbs */
			.floating-orbs {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: 0;
				overflow: hidden;
			}

			.orb {
				position: absolute;
				border-radius: 50%;
				filter: blur(80px);
				opacity: 0.4;
				animation: floatOrb 25s infinite alternate ease-in-out;
			}

			.orb-1 {
				width: 40vw;
				height: 40vw;
				background: radial-gradient(circle, #1e3a8a 0%, transparent 70%);
				top: -10%;
				right: -5%;
			}

			.orb-2 {
				width: 35vw;
				height: 35vw;
				background: radial-gradient(circle, #1e40af 0%, transparent 70%);
				bottom: -15%;
				left: -5%;
				animation-delay: -5s;
			}

			/* Hotspots */
			.hotspot {
				position: absolute;
				width: 24px;
				height: 24px;
				background: rgba(255, 255, 255, 0.3);
				border: 2px solid #fff;
				border-radius: 50%;
				cursor: pointer;
				z-index: 150;
				display: flex;
				justify-content: center;
				align-items: center;
				transition: transform 0.3s ease, background 0.3s ease;
			}

			.hotspot::after {
				content: '';
				position: absolute;
				width: 100%;
				height: 100%;
				border-radius: 50%;
				border: 1px solid #fff;
				animation: pulse 2s infinite;
			}

			.hotspot:hover {
				transform: scale(1.3);
				background: #fff;
			}

			.hotspot-label {
				position: absolute;
				left: 35px;
				background: rgba(255, 255, 255, 0.15);
				backdrop-filter: blur(10px);
				padding: 8px 15px;
				border-radius: 20px;
				white-space: nowrap;
				opacity: 0;
				transform: translateX(-10px);
				transition: all 0.3s ease;
				pointer-events: none;
				border: 1px solid rgba(255, 255, 255, 0.1);
				font-size: 0.8rem;
				font-weight: 500;
			}

			.hotspot:hover .hotspot-label {
				opacity: 1;
				transform: translateX(0);
			}

			/* Gallery Ribbon */
			.gallery-ribbon {
				position: absolute;
				bottom: 5%;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 20px;
				z-index: 100;
				animation: fadeInUp 1s ease-out 0.8s both;
			}

			.gallery-item {
				width: 80px;
				height: 80px;
				background: rgba(255, 255, 255, 0.05);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				cursor: pointer;
				transition: all 0.3s ease;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 0.7rem;
				text-align: center;
				padding: 5px;
				color: rgba(255, 255, 255, 0.4);
				overflow: hidden;
				position: relative;
			}

			.gallery-item:hover {
				background: rgba(255, 255, 255, 0.15);
				transform: translateY(-5px);
				border-color: rgba(255, 255, 255, 0.3);
				color: #fff;
			}

			.gallery-item::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
			}

			/* Animations */
			@keyframes floatOrb {
				0% { transform: translate(0, 0); }
				100% { transform: translate(50px, 30px); }
			}

			@keyframes pulse {
				0% { transform: scale(1); opacity: 0.8; }
				100% { transform: scale(2.5); opacity: 0; }
			}

			@keyframes staggerFadeIn {
				from { opacity: 0; transform: translateX(30px); }
				to { opacity: 1; transform: translateX(0); }
			}

			/* Top Header */
			.top-nav {
				position: absolute;
				top: 5%;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 40px;
				z-index: 100;
				animation: fadeInDown 1s ease-out;
			}

			.nav-link {
				text-decoration: none;
				color: rgba(255, 255, 255, 0.5);
				font-size: 0.8rem;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				transition: color 0.3s ease;
			}

			.nav-link:hover {
				color: #fff;
			}

			/* Spotlight Glow */
			.bg-glow {
				position: absolute;
				top: 50%;
				left: 45%;
				transform: translate(-50%, -50%);
				width: 70vh;
				height: 70vh;
				background: radial-gradient(circle, rgba(26, 42, 71, 0.6) 0%, rgba(26, 42, 71, 0) 70%);
				border-radius: 50%;
				filter: blur(60px);
				z-index: 0;
				pointer-events: none;
			}

			@keyframes fadeInSlideLeft {
				from { opacity: 0; transform: translateY(-50%) translateX(50px); }
				to { opacity: 1; transform: translateY(-50%) translateX(0); }
			}

			@keyframes fadeInUp {
				from { opacity: 0; transform: translateY(50px); }
				to { opacity: 1; transform: translateY(0); }
			}

			@keyframes fadeInDown {
				from { opacity: 0; transform: translate(-50%, -50px); }
				to { opacity: 1; transform: translate(-50%, 0); }
			}

			@media (max-width: 1024px) {
				.sidebar-specs, .product-intro, .bg-watermark, .gallery-ribbon, .hotspot { display: none; }
				.top-nav { gap: 20px; }
			}

		</style>

		<script type="importmap">
			{
			  "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
			  }
			}
		</script>

	</head>
	
	<body>
		<div id="loadingUI" class="rotate_anim"></div>
		<div class="fimawork_logo" onclick="parent.open('https://fimawork.tw/')"></div>
		<div class="web3d_icon"></div>

		<!-- Background Elements -->
		<div class="floating-orbs">
			<div class="orb orb-1"></div>
			<div class="orb orb-2"></div>
		</div>
		<div class="bg-glow"></div>
		<div class="bg-watermark">iPhone 17 Pro</div>

		<!-- UI Elements -->
		<header class="top-nav">
			<a href="#" class="nav-link">Overview</a>
			<a href="#" class="nav-link">Tech Specs</a>
			<a href="#" class="nav-link">Gallery</a>
			<a href="#" class="nav-link">Compare</a>
		</header>

		<section class="sidebar-specs">
			<div class="spec-item">
				<span class="spec-icon">💎</span>
				<span class="spec-label">Material</span>
				<span class="spec-value">Grade 5 Titanium</span>
			</div>
			<div class="spec-item">
				<span class="spec-icon">🚀</span>
				<span class="spec-label">Chip</span>
				<span class="spec-value">A18 Pro Bionic</span>
			</div>
			<div class="spec-item">
				<span class="spec-icon">📸</span>
				<span class="spec-label">Camera</span>
				<span class="spec-value">48MP Fusion</span>
			</div>
		</section>

		<article class="product-intro">
			<h2 class="intro-title">Web3D<br>Concept</h2>
			<p class="intro-desc">Aerospace-grade durability meets the most advanced mobile silicon. Designed to be legendary.</p>
		</article>

		<div class="model_info" style=" left: 84%;">
			<div class="titlePanel">
				<p class="detail_title">Model</p>
				<p class="detail_title">Author</p>
				<p class="detail_title">Link</p>
			</div>
			<div class="detailPanel">
				<p class="detail_value">iPhone 17 Pro</p>
				<p class="detail_value">Ranguel</p>
				<p class="detail_value">https://skfb.ly/pCnq8</p>
			</div>
		</div>

		<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {CameraManager,UpdateCameraPosition, InputEvent,Camera_Inspector,SetDefaultCameraStatus,InstFBXLoader,InstGLTFLoader,FindMataterialByName,posData,dracoLoader,LoadHDRWithPMREM} from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v1.2/fx_functions.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

import { iphone_17_pro_withCase } from './models/iphone_17_pro_withCase_slices.js';

let _loadingUI = document.getElementById("loadingUI");

let scene, camera, renderer, stats, mixer;
let labelRenderer;
let controls;
let idleTime=0;

const clock = new THREE.Clock();

const modelPosition=new THREE.Vector3(0,0,0);
const modelRotation=new THREE.Vector3(0,-Math.PI*0.5, 0);
const modeScale=0.2;

const CameraDefaultPos=new THREE.Vector3(-5,0,0);
const ControlsTargetDefaultPos=new THREE.Vector3(0,0,0);

const labelTarget_01=new THREE.Object3D();
const labelTarget_02=new THREE.Object3D();
const labelTarget_03=new THREE.Object3D();

const hold_time=6;


init();

function init()
{
  	scene = new THREE.Scene();

  	camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );//非全螢幕比例設定
  	renderer = new THREE.WebGLRenderer({ antialias: true });
  	renderer.setSize(window.innerWidth , window.innerHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 0.5;
  	document.body.appendChild( renderer.domElement );

	labelRenderer = new CSS2DRenderer();
	labelRenderer.setSize( window.innerWidth , window.innerHeight );
	labelRenderer.domElement.style.position = 'absolute';
	labelRenderer.domElement.style.top = '0px';
	document.body.appendChild( labelRenderer.domElement );

	
  	camera.position.copy(CameraDefaultPos);
  	posData[0]={ camera_pos:CameraDefaultPos, controlsTarget_pos:ControlsTargetDefaultPos};


	//加密模組
	function base64ToArrayBuffer(base64) 
	{
		// 去除所有非 base64 字元
		base64 = base64.replace(/[^A-Za-z0-9+/=]/g, "");

    	const binary = atob(base64);
    	const len = binary.length;
    	const bytes = new Uint8Array(len);

    	for (let i = 0; i < len; i++) 
		{
    	    bytes[i] = binary.charCodeAt(i);
    	}

    	return bytes.buffer;
	}

	const arrayBuffer = base64ToArrayBuffer(iphone_17_pro_withCase());

	//draco模組
	dracoLoader.setDecoderPath( 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/' );
	dracoLoader.preload();

	const loader = new GLTFLoader();
	loader.setDRACOLoader(dracoLoader);
	loader.parse(
		arrayBuffer,
		'',
		(gltf) => {
			
	
			const model = gltf.scene;
			model.position.copy(modelPosition);
			model.rotation.set(modelRotation.x, modelRotation.y, modelRotation.z);
			model.scale.set(modeScale,modeScale,modeScale);
			model.name="iphone with case";
			
			const glassMaterial = new THREE.MeshPhysicalMaterial( {
			color: 0xffffff, 
			transparent:true,//沒設定，畫面會出錯
			transmission: 1,
			metalness: 0.5, 
			roughness: 0, 
			ior:1,//<1畫面會不穩定
			depthWrite:false
			} );

			let pc_case=model.getObjectByName("case");

			pc_case.traverse( function ( object ) {				
				if ( object.isMesh )
				{
					object.material=glassMaterial;
				}
			})
			
			scene.add(model);
			animate();

			setTimeout(() => {_loadingUI.remove();}, 600);
		},
		(error) => {
			console.error('Failed to load model:', error);
		}
	);

		
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
  	controls = new OrbitControls( camera,labelRenderer.domElement );
  	controls.enablePan = false;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.maxDistance = 500;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.2;
  	controls.update();

  	///hdri 環境光源

	LoadHDRWithPMREM('./textures/hdri/studio_small_09_2k.hdr',scene,renderer) 

	///光源
	

	const pointLight = new THREE.PointLight( 0xffffff, 15 );
	pointLight.position.set(-0.3,2.1,-1);

	const helper = new THREE.PointLightHelper(pointLight);
	//scene.add(helper);

	scene.add( pointLight );

	///桌布

	let HUD = new THREE.Object3D();

	const loader_HUD = new TIFFLoader();

	const geometry_HUD = new THREE.PlaneGeometry();

	loader_HUD.load( './images/iphone_wallpaper.tif', function ( texture ) {

		texture.colorSpace = THREE.SRGBColorSpace;

		const material_HUD = new THREE.MeshBasicMaterial( { map: texture, transparent: true,blending: THREE.AdditiveBlending,opacity:0.9 ,depthWrite: false } );

		const mesh_HUD = new THREE.Mesh( geometry_HUD, material_HUD );
		const img_scale =0.16;

		mesh_HUD.position.set( 0.09, 0, 0 );
		mesh_HUD.scale.set(img_scale*8.4,img_scale*18.17,1);
		mesh_HUD.rotation.y=Math.PI/2;
		HUD.add(mesh_HUD);

		scene.add( HUD );
	} );

	 labelTarget_01.position.set(-0.1,-0.1,0);
     labelTarget_02.position.set(0,1,-0.75);
     labelTarget_03.position.set(0,-1.5,0.2);

	 scene.add(labelTarget_01).add(labelTarget_02).add(labelTarget_03);

	 InstSceneBtn("hotspot","hotspot-label",labelTarget_01,"MagSafe Module");
	 InstSceneBtn("hotspot","hotspot-label",labelTarget_02,"Compact Case");
	 InstSceneBtn("hotspot","hotspot-label",labelTarget_03,"Raised Bezels");

	function InstSceneBtn(thisMainCSS,thisSubCSS,thisLabelTarget,thisContent)
	{
		const MainDiv = document.createElement( 'div' );
  		MainDiv.className = thisMainCSS;

		const SubDiv = document.createElement( 'div' );
  		SubDiv.className = thisSubCSS;
		SubDiv.textContent=thisContent;
		MainDiv.append(SubDiv);
  
  		const Label = new CSS2DObject( MainDiv );
  		Label.position.set( thisLabelTarget.position.x,thisLabelTarget.position.y,thisLabelTarget.position.z);
  		Label.center.set( 0.5, 0.5 );
  		thisLabelTarget.attach( Label );
  		Label.layers.set( 0 );
  		Label.name="sceneButton";

 		MainDiv.addEventListener("pointerdown", (event) => {

			console.log("YES");
 		   	///不執行頁面縮放 
 		  	event.preventDefault();
 		  	event.stopPropagation();

 		});

	}

	///EventListener
  	window.addEventListener( 'resize', onWindowResize );  

  	renderer.domElement.addEventListener("pointerdown", (event) => {
		idleTime=0;
		controls.autoRotate=false;
  	});

	renderer.domElement.addEventListener( 'pointermove', function(e) {
		idleTime=0;
		controls.autoRotate=false;
	});
  	renderer.domElement.addEventListener("wheel", (event) => {
		idleTime=0;
		controls.autoRotate=false;
	});
}


function onWindowResize() 
{
    camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
    renderer.setSize( window.innerWidth, window.innerHeight);
	labelRenderer.setSize( window.innerWidth, window.innerHeight );
}

function animate() 
{
  	requestAnimationFrame( animate );

  	controls.update();
  	renderer.render( scene, camera );
	labelRenderer.render( scene, camera );
  	UpdateCameraPosition(camera,controls);


	const delta = clock.getDelta();

	if ( mixer ) mixer.update( delta );

	idleTime+=delta;

	if(idleTime>hold_time)
	{
		idleTime=0;
		controls.autoRotate=true;
	}
}
		</script>
    </body>

</html>
