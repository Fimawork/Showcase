			@import url('https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@main/fx_ui.css');

				position: absolute;

			#banner
			{
				position: absolute;
				top: 50%;

			{
				position: absolute;

        		color: rgba(60,60,60,1);

			.btn_panel
			{
				position: absolute;

        		transform: translateX(-50%);

			.btn
			{
				margin: 0 6px;
       			height: 100%;

			}

			.fimawork_logo
			{
				position:absolute;
				left: 50%;

				height: 9%;

				background-size: contain;
				background-repeat: no-repeat;
				z-index: 99;
				user-select: none;
				pointer-events: none;
				transform: translate(-50%,-50%);

			@media (hover: hover) {
        		.subTitle:hover { cursor: pointer; background-color: rgba(255,255,255,0.3); }

		<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.55/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.55/fx_materials.js';
import * as FXUI from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.55/fx_hud.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { FC001_128_A_2026 } from './models/FC001_128_A_2026_slices.js';
import { Pull_128_20250921_20260908 } from './models/Pull_128_20250921_20260908_slices.js';
import { FC005_128_A_20260908 } from './models/FC005_128_A_20260908_slices.js';
import { FC003_20260908 } from './models/FC003_20260908_slices.js';
import { Pull_128_20220715_20260908 } from './models/Pull_128_20220715_20260908_slices.js';
import { Knob_20250921_20260908 } from './models/Knob_20250921_20260908_slices.js';

import { mix, pass, renderOutput, smoothstep, uniform, vec3 } from 'three/tsl';
			import { boxBlur } from 'three/addons/tsl/display/boxBlur.js';
			import { fxaa } from 'three/addons/tsl/display/FXAANode.js';
import gsap from 'https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js';

let scene, camera, renderer, stats, mixer;
let controls;
let threeContainer = document.getElementById("threeContainer");
let _loadingUI = document.getElementById("loadingUI");

let _btn_0 = document.getElementById("btn_0");
let _btn_1 = document.getElementById("btn_1");
let _btn_2 = document.getElementById("btn_2");
let _btn_3 = document.getElementById("btn_3");
let _btn_4 = document.getElementById("btn_4");
let _btn_5 = document.getElementById("btn_5");

let _banner = document.getElementById("banner");

const timer = new THREE.Timer();

const CameraDefaultPos=new THREE.Vector3(66,12,-12);
const ControlsTargetDefaultPos=new THREE.Vector3(60,0,0);

const modelPosition=new THREE.Vector3(60,0,0);
const modelRotation=new THREE.Vector3(0,Math.PI, 0);
const modeScale=0.12;

let carouselManu = new THREE.Group();

let item_01 = new THREE.Object3D();
let item_02 = new THREE.Object3D();
let item_03 = new THREE.Object3D();
let item_04 = new THREE.Object3D();
let item_05 = new THREE.Object3D();
let item_06 = new THREE.Object3D();

let item_list=[];
let btn_list=[];
let item_index=0;

const item_num=6;
const divisionAngle = 2*Math.PI/item_num;//2*Math.PI為360度

let rotationTarget = new THREE.Object3D();
const quaternion_rotationTarget = new THREE.Quaternion();
const quaternion_carouselManu = new THREE.Quaternion();

let isRotateOn=false;
const normal_rpm=0.015;
let rpm=0.015;//變數，按鍵選單時可提高轉速

let idleTime=0;
const hold_time=4.5;

let renderPipeline;


init();
FXUI.InstLoadingEffect_Type_B(true);
//SceneFadeInEffect(renderer, 7);

async function init()
{
	FX.SetupEnvironment("cloud");

  	scene = new THREE.Scene();

	let newFOV=threeContainer.clientWidth / threeContainer.clientHeight<1.5?70:45;

  	camera = new THREE.PerspectiveCamera( newFOV, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 50 );//非全螢幕比例設定
  	renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
  	renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 1.0;
  	//document.body.appendChild( renderer.domElement );
  	threeContainer.appendChild( renderer.domElement );

	await renderer.init();

  	camera.position.copy(CameraDefaultPos);
  
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
  	controls = new OrbitControls( camera, renderer.domElement );
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.05;
  	controls.maxDistance = 30;
	controls.minDistance = 12;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
  	controls.update();

  	///hdri 環境光源
	FX.LoadUltraHDRForWebGPU('./textures/hdri/brown_photostudio_02_1k.jpg', scene);
	scene.environmentRotation.y  = FX.ToThreeEulerAngle(-90);

	carouselManu.add(item_01).add(item_02).add(item_03).add(item_04).add(item_05).add(item_06);
	scene.add(carouselManu);

	FX.posData[0]={ camera_pos:CameraDefaultPos, controlsTarget_pos:ControlsTargetDefaultPos};

	///fc_001 
	const loader_fc_001 = new GLTFLoader();
    loader_fc_001.setDRACOLoader(FX.dracoLoader);
	loader_fc_001.parse(
    FX.Base64ToArrayBuffer(FC001_128_A_2026()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.copy(modelRotation);
		model.scale.set(modeScale,modeScale,modeScale);

		const black_material=FXM.InstMaterial(0x404040,0.403,0.894,0,1.5,0.5,false,1,true);

		const material_bottomEdge = FXM.InstEtchingMaterial(0xffc500, 0.4, 1, 0.75, false, 1, "./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg", new THREE.Vector2(1.2, 0.5), new THREE.Vector2(0, 0), './textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg', new THREE.Vector2(0,0), 0);

		const material_body = FXM.InstEtchingMaterial(0xcc991b, 0.4, 1, 0.75, false, 1, "./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg", new THREE.Vector2(5, 1), new THREE.Vector2(0, 0), './textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg', new THREE.Vector2(0,0), 0);

		const material_body_2 = FXM.InstEtchingMaterial(0xcc991b, 0.4, 1, 0.75, false, 1, "./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg", new THREE.Vector2(0.5, 0.5), new THREE.Vector2(0, 0), './textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg', new THREE.Vector2(0,0), 0);

		const material_body_3 = FXM.InstEtchingMaterial(0xcc991b, 0.4, 1, 0.75, false, 1, "./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg", new THREE.Vector2(0.5, 2.5), new THREE.Vector2(0, 0), './textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg', new THREE.Vector2(0,0), 0);

		const material_body_4 = FXM.InstEtchingMaterial(0xcc991b, 0.4, 1, 0.75, false, 1, "./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg", new THREE.Vector2(2.5, 0.5), new THREE.Vector2(0, 0), './textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg', new THREE.Vector2(0,0), 0);

		model.traverse(function (object) {	
			if (object.name.includes("FC001-128-B_Black")) {FX.ReturnBufferGeometry(object, black_material, item_03, scene);}
			if (object.name.includes("FC001-128-B_Body")) {FX.ReturnBufferGeometry(object,material_body, item_03, scene);}
			if (object.name.includes("FC001-128-B_Edge")) {FX.ReturnBufferGeometry(object, null, item_03, scene);}
			if (object.name.includes("FC001-128-B_2")) {FX.ReturnBufferGeometry(object, material_body_2, item_03, scene);}
			if (object.name.includes("FC001-128-B_3")) {FX.ReturnBufferGeometry(object, material_body_3, item_03, scene);}
			if (object.name.includes("FC001-128-B_BottomEdge_B")) {FX.ReturnBufferGeometry(object, material_bottomEdge, item_03, scene);}
			if (object.name.includes("FC001-128-B_BottomEdge_A")) {FX.ReturnBufferGeometry(object, material_bottomEdge, item_03, scene);}
			if (object.name.includes("FC001-128-B_4")) {FX.ReturnBufferGeometry(object, material_body_4, item_03, scene);}
		});

		setTimeout(() => {item_03.rotation.y=divisionAngle*4;}, 100);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///pull_128_20250921 
	const loader_pull_128_a = new GLTFLoader();
    loader_pull_128_a.setDRACOLoader(FX.dracoLoader);
	loader_pull_128_a.parse(
    FX.Base64ToArrayBuffer(Pull_128_20250921_20260908()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.copy(modelRotation);
		model.scale.set(modeScale,modeScale,modeScale);

		const gold_material=FXM.InstMaterial(0xD2CBA3,0.15,1,0,1.5,0.5,false,1,true);
		const black_material=FXM.InstMaterial(0x4D4D4D,0.2156629,1,0,1.5,0.5,false,1,true);

		FXM.ClearCoatEffect(black_material,1,0.05);

		model.traverse(function (object) {	
			if (object.name.includes("gold")) {FX.ReturnBufferGeometry(object, gold_material, item_01, scene);}
			if (object.name.includes("black")) {FX.ReturnBufferGeometry(object,black_material, item_01, scene);}
		});

		setTimeout(() => {item_01.rotation.y=divisionAngle*6;}, 200);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///fc005_128_a
	const loader_fc_005_a = new GLTFLoader();
    loader_fc_005_a.setDRACOLoader(FX.dracoLoader);
	loader_fc_005_a.parse(
    FX.Base64ToArrayBuffer(FC005_128_A_20260908()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.y=FX.ToThreeEulerAngle(180);
		model.scale.set(modeScale*0.8,modeScale*0.8,modeScale*0.8);

		const black_material=FXM.InstMaterial(0x404040,0.403,0.894,0,1.5,0.5,false,1,true);
		FXM.ClearCoatEffect(black_material,0.5,0.4);

		const nickel_material=FXM.InstMaterial(0xDBD1AD,0,1,0,1.5,0.5,false,1,true);

		model.traverse(function (object) {	
			if (object.name.includes("FC005_128_A_nickel")) {FX.ReturnBufferGeometry(object, nickel_material, item_02, scene);}
			if (object.name.includes("FC005_128_A_pc")) {FX.ReturnBufferGeometry(object,null, item_02, scene);}
			if (object.name.includes("FC005_128_A_black")) {FX.ReturnBufferGeometry(object,black_material, item_02, scene);}
		});

		setTimeout(() => {item_02.rotation.y=divisionAngle*5;}, 300);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///fc003
	const loader_fc_003 = new GLTFLoader();
    loader_fc_003.setDRACOLoader(FX.dracoLoader);
	loader_fc_003.parse(
    FX.Base64ToArrayBuffer(FC003_20260908()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.y=FX.ToThreeEulerAngle(180);
		model.scale.set(modeScale,modeScale,modeScale);

		model.traverse(function (object) {	
			if (object.name.includes("FC003-128-A")) {FX.ReturnBufferGeometry(object, null, item_04, scene);}
			if (object.name.includes("FC003-160-A")) {FX.ReturnBufferGeometry(object,null, item_04, scene);}
			if (object.name.includes("FC003-Knob")) {FX.ReturnBufferGeometry(object,null, item_04, scene);}
		});

		setTimeout(() => {item_04.rotation.y=divisionAngle*3;}, 400);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///Pull_128_20220715
	const loader_Pull_128_20220715_20260908 = new GLTFLoader();
    loader_Pull_128_20220715_20260908.setDRACOLoader(FX.dracoLoader);
	loader_Pull_128_20220715_20260908.parse(
    FX.Base64ToArrayBuffer(Pull_128_20220715_20260908()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.y=FX.ToThreeEulerAngle(180);
		model.scale.set(modeScale,modeScale,modeScale);

		const material_top = FXM.InstEtchingMaterial(0xBABABA,0.5,0.75,0,false,1,"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(4.5,3),new THREE.Vector2(0,0),"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(3,2),0);

		const material_body = FXM.InstEtchingMaterial(0xBABABA,0.45,1,0.7500000000000001,false,1,"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(1,5),new THREE.Vector2(0,0),"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(1,1),0);

		model.traverse(function (object) {	
			if (object.name.includes("Shell_Top")) {FX.ReturnBufferGeometry(object, material_top, item_05, scene);}
			if (object.name.includes("Shell_Body")) {FX.ReturnBufferGeometry(object,material_body, item_05, scene);}
			if (object.name.includes("Shell_Pattern_Right")) {FX.ReturnBufferGeometry(object,null, item_05, scene);}
			if (object.name.includes("Shell_Pattern_Left")) {FX.ReturnBufferGeometry(object,null, item_05, scene);}
			if (object.name.includes("Edge")) {FX.ReturnBufferGeometry(object,null, item_05, scene);}
		});

		setTimeout(() => {item_05.rotation.y=divisionAngle*2;}, 500);
    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	///Knob_20250921_20260908
	const loader_Knob_20250921_20260908 = new GLTFLoader();
    loader_Knob_20250921_20260908.setDRACOLoader(FX.dracoLoader);
	loader_Knob_20250921_20260908.parse(
    FX.Base64ToArrayBuffer(Knob_20250921_20260908()),
    '',
    (gltf) => {
        
		const model = gltf.scene;
		model.position.copy(modelPosition);
		model.rotation.y=FX.ToThreeEulerAngle(180);
		model.scale.set(modeScale*1.2,modeScale*1.2,modeScale*1.2);

		const black_material=FXM.InstMaterial(0x000000,1,0,0,1.5,0.5,false,1,true);
		const A_material = FXM.InstEtchingMaterial(0xDB9C43,0.3,1,0.7500000000000001,false,1,"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(1,5),new THREE.Vector2(0,0),"./textures/yan-ots-UuBR5kbvt4Y-unsplash.jpg",new THREE.Vector2(1,1),0);

	});

function onWindowResize() 
{
    camera.aspect = threeContainer.clientWidth/threeContainer.clientHeight;//非全螢幕比例設定
	camera.updateProjectionMatrix();
    renderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight);
}

function animate(timestamp) 
{
  	controls.update();
  	renderer.render( scene, camera );

	//renderPipeline.render();

	//影子工具
	FX.UpdateWebGPUShadow(renderer, scene);

	UpdateRotationManu();

	// 自動更新時間（用來計算移動速度、旋轉等）
    timer.update( timestamp );
	const delta = timer.getDelta();

	if(!isRotateOn)
	{
		idleTime+=delta;

		if(idleTime>hold_time)
		{
			idleTime=0;

			ManuRotate();
		}
	}

	if(Math.abs(carouselManu.position.x)>5)idleTime=0;
		

	
	if(Math.abs(carouselManu.position.x)>0.01)//絕對值
	{
		carouselManu.position.x = THREE.MathUtils.lerp(carouselManu.position.x,0,0.025);
	}

	else
	{
		carouselManu.position.x=0;
	}
	
}

function UpdateRotationManu()
{
	
	quaternion_rotationTarget.setFromEuler(rotationTarget.rotation);

	if(quaternion_carouselManu.angleTo(quaternion_rotationTarget)>0.01)
    {
		quaternion_carouselManu.slerp(quaternion_rotationTarget,rpm);
		isRotateOn=true;
    } 

	else
	{
		isRotateOn=false;
		rpm=normal_rpm;//回復正常轉速
	}

	carouselManu.rotation.setFromQuaternion(quaternion_carouselManu);   
}

function ManuRotate()
{
	FX.CameraManager_Type_B(0, camera, controls, window, 1000);
    rotationTarget.rotation.y += divisionAngle;
    item_index = (item_index + 1) % item_num;
    ShowItem(item_index);
}

function ShowItem(index)
{
	item_list.forEach((item, idx) => {
        if (idx === index) {
            item.visible = true;
            if (btn_list[idx]) btn_list[idx].style.backgroundColor = "rgba(255, 255, 255, 1)";
        } else {
            setTimeout(() => { if (item_index !== idx) item.visible = false; }, 1000);
            if (btn_list[idx]) btn_list[idx].style.backgroundColor = "rgba(210, 210, 210, 0.3)";
        }
    });
}

function SetupItemGroup()
{
	//3D
	item_list.push(item_01);
	item_list.push(item_02);
	item_list.push(item_03);
	item_list.push(item_04);
	item_list.push(item_05);
	item_list.push(item_06);

	item_01.visible=true;
	item_02.visible=false;
	item_03.visible=false;
	item_04.visible=false;
	item_05.visible=false;
	item_06.visible=false;

	//UI按鍵
	btn_list.push(_btn_0);
	btn_list.push(_btn_1);
	btn_list.push(_btn_2);
	btn_list.push(_btn_3);
	btn_list.push(_btn_4);
	btn_list.push(_btn_5);

	//預設第一項active
	_btn_0.style.backgroundColor="rgba(255, 253, 253, 1)";
}

///輪播進度按鍵
function FocusToItem(i)
{
	if (!isRotateOn) {
        ShowItem(i);
        item_index = i;
        FX.CameraManager_Type_B(0, camera, controls, window, 1000);
        rpm = 0.08;
        rotationTarget.rotation.y = divisionAngle * i;
        idleTime = 0;
    }
}

function SceneFadeInEffect(thisRenderer, thisDuration = 5) 
{
    
	const effectController = {
		focusDistance: uniform( 500 ),
		focalLength: uniform( 200 ),
		bokehScale: uniform( 10 )
	};

	// post processing

	renderPipeline = new THREE.RenderPipeline( thisRenderer );
	renderPipeline.outputColorTransform = false;

	// DOF uniforms

	let blurSize = uniform( 2 ); // determines the kernel size of the blur
	let blurSpread = uniform( 4 ); // determines how far the blur is spread
	let minDistance = uniform( 0 ); // all positions at or below minDistance will be completely in focus.
	let maxDistance = uniform( 5 ); // all positions at or beyond maxDistance will be completely out of focus.

	const focusPointView = uniform( vec3() );

	// beauty and blur/out-of-focus pass

	const scenePass = pass( scene, camera );
			
	const scenePassColor = scenePass.getTextureNode().toInspector( 'Color' );
	const scenePassViewZ = scenePass.getViewZNode();
	const scenePassBlurred = boxBlur( scenePassColor, { size: blurSize, separation: blurSpread } );

	// simple DOF from https://lettier.github.io/3d-game-shaders-for-beginners/depth-of-field.html

	const blur = smoothstep( minDistance, maxDistance, scenePassViewZ.sub( focusPointView.z ).abs() );
	const dofPass = mix( scenePassColor, scenePassBlurred, blur );

	const outputPass = renderOutput( dofPass );
	const fxaaPass = fxaa( outputPass );

	renderPipeline.outputNode = fxaaPass;

	gsap.to(blurSize, {
		value: 0.0,
		duration: thisDuration,
		ease: 'power2.inOut',
		onComplete: () => {
			blurSize = 0.0;
		}
	});

	gsap.to(blurSpread, {
		value: 0.0,
		duration: thisDuration,
		ease: 'power2.inOut',
		onComplete: () => {
			blurSpread = 0.0;
		}
	});

	gsap.to(minDistance, {
		value: 3.0,
		duration: thisDuration,
		ease: 'power2.inOut',
		onComplete: () => {
			minDistance = 3.0;
		}
	});

	gsap.to(maxDistance, {
		value: 5.0,
		duration: thisDuration,
		ease: 'power2.inOut',
		onComplete: () => {
			maxDistance = 5.0;
		}
	});
}
