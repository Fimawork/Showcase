			@import url('https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@main/fx_ui.css');

			{
				margin: 0;

			{
				width: 100%;
   				height: 100%;

			/* 太空場景背景（2D Canvas 繪製，固定在 3D 畫布後方） */
			#spaceBackdrop
			{
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
				z-index: -1;
				pointer-events: none;

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",

	<body>
		<canvas id="spaceBackdrop"></canvas>
		<div class="fimawork_logo" onclick="parent.open('https://fimawork.tw/')"></div>
		<script type="module">

import * as THREE from 'three';

//RenderPipeline工具
import { pass, vec4 } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.2/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v1.5/fx_materials.js';
import * as FXUI from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@2.41/fx_hud.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { keyboard_2026 } from './models/keyboard_2026_slices.js';

let scene, camera, renderer, stats, mixer,container;
let renderPipeline;
let controls;
let threeContainer = document.getElementById("threeContainer");

const timer = new THREE.Timer();


const CameraDefaultPos=new THREE.Vector3(-13.217,5.203,11.497);
const ControlsTargetDefaultPos=new THREE.Vector3(-4.236,0.614,1.933);

let idleTime=0;
const hold_time=6;

const params = {
	threshold: 1,
	strength: 2.4,
	radius: 1,
	exposure: 0.6
};

///太空場景色彩設定（參考：黑色 + 螢光綠）
const SPACE = {
	neon: 0x6dff2a,          //輪廓光顏色
	rimIntensity: 5          //綠色輪廓光強度
};


DrawSpaceBackdrop();
init();
FXUI.InstLoadingEffect_Type_A(true);

async function init()
{
	FX.SetupEnvironment("cloud");

	container = document.createElement( 'div' );
 	document.body.appendChild( container );

  	scene = new THREE.Scene();

  	camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 1000 );//非全螢幕比例設定
  	renderer = new THREE.WebGPURenderer( { antialias: true } );
  	renderer.setSize( window.innerWidth, window.innerHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = params.exposure;
  	document.body.appendChild( renderer.domElement );

	// 1. 先等待 Renderer 初始化完成
	await renderer.init(); // 記得 r184 一定要加上這行非同步初始化！
	// 2. 初始化完成後，再啟動動畫循環（這行會自己一直跑，不用手動 call 第一次）
	renderer.setAnimationLoop( animate );

	// 初始化 RenderPipeline
	renderPipeline = new THREE.RenderPipeline( renderer );
	const scenePass = pass( scene, camera );
	const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
	const bloomPass = bloom( scenePassColor ).toInspector( 'Bloom' );
	//保留場景的透明度：沒有物件的地方維持透明，才看得到後方的星球背景；
	//bloom 光暈以加法疊在背景上（canvas 為 premultiplied alpha）
	renderPipeline.outputNode = vec4( scenePassColor.rgb.add( bloomPass.rgb ), scenePassColor.a );

	bloomPass.threshold.value = params.threshold;
	bloomPass.strength.value = params.strength;
	bloomPass.radius.value = params.radius;

  	camera.position.copy(CameraDefaultPos);

  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
  	controls = new OrbitControls( camera, renderer.domElement );
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.3;
	controls.minDistance = 8;
	controls.maxDistance = 40;
	controls.maxPolarAngle=FX.ToThreeEulerAngle(105);
	controls.minPolarAngle=FX.ToThreeEulerAngle(-105);
  	controls.update();

  	///hdri 環境光源
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);
	scene.environmentIntensity = 0.8;//太空場景較暗，略降環境反射

	const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x0b120a, 0.6 );
	hemiLight.position.set( 0, 20, 0 );
	scene.add( hemiLight );

	const dirLight = new THREE.DirectionalLight( 0xffffff,4 );
	dirLight.position.set( - 3, 10, - 10 );
	scene.add( dirLight );

	const loader_keyboard = new GLTFLoader();
    loader_keyboard.setDRACOLoader(FX.dracoLoader);
	loader_keyboard.parse(
    FX.Base64ToArrayBuffer(keyboard_2026()),
    '',
    (gltf) => {

		const model = gltf.scene;

		model.position.set(0,0,0);
		model.rotation.set(FX.ToThreeEulerAngle(45),FX.ToThreeEulerAngle(0), FX.ToThreeEulerAngle(0));
		model.scale.set(0.05,0.05,0.05);

		const button_material=FXM.InstMaterial(0x000000,0.5,0.5,0,1.27,1,false,1,true);
		const padding_material=FXM.InstMaterial(0x545454,0.9,0.6,0,1.27,1,false,1,true);

		model.traverse( function ( object ) {

			if(object.name.includes("button")||object.name.includes("base"))
        	{
			  FX.ReturnBufferGeometry(object,button_material,null,scene);
        	}

			if(object.name.includes("padding"))
        	{
			  FX.ReturnBufferGeometry(object,padding_material,null,scene);
        	}

			if(object.name.includes("light"))
        	{
			  for(let i=0;i<object.children.length;i++)
			  {

				const color_code = object.children[i].name.split(/_\d+/)[0];
				InstLight(object.children[i],color_code);
				//object.children[i].scale.set(1.02,1,1.02);
			  }
        	}

			if(object.name.includes("words"))
        	{
			  for(let i=0;i<object.children.length;i++)
			  {

				const color_code = object.children[i].name.split(/_\d+/)[0];
				InstEmissiveWords(object.children[i],color_code);
				//console.log(color_code);
			  }
        	}
		});

		scene.add(model);

		scene.environmentRotation.y = FX.ToThreeEulerAngle(-30);

		///太空場景：綠色輪廓光（依模型實際範圍自動定位）
		AddRimLight(model);

		FXUI.InstLoadingEffect_Type_A(false)
        //FX.Material_Inspector(scene);

    },
    (error) => {
        console.error('Failed to load model:', error);
    }
	);

	//FX.Camera_Inspector(camera,controls);

	///EventListener
  	window.addEventListener( 'resize', onWindowResize );

  		window.addEventListener("pointerdown", (event) => {

		idleTime=0;
		controls.autoRotate=false;

	});

	window.addEventListener( 'pointermove', function(e) {

		idleTime=0;
		controls.autoRotate=false;

	});

  	window.addEventListener("wheel", (event) => {

		idleTime=0;
		controls.autoRotate=false;

	});
}


function onWindowResize()
{
    camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
    renderer.setSize( window.innerWidth, window.innerHeight);

	clearTimeout(onWindowResize._t);
	onWindowResize._t = setTimeout(DrawSpaceBackdrop, 150);//背景重繪（防抖）
}

function animate(timestamp)
{

  	controls.update();
	renderPipeline.render();

	// 自動更新時間（用來計算移動速度、旋轉等）
    timer.update( timestamp );
	const delta = timer.getDelta();

	if ( mixer ) mixer.update( delta );

	idleTime+=delta;

	if(idleTime>hold_time)
	{
		controls.autoRotate=true;
	}
}

function InstLight(target,thisColor)
{
	const keyMaterial = new THREE.MeshStandardMaterial({
	    color: thisColor,       // 鍵帽本體顏色（深色）
	    emissive: thisColor,    // 發光顏色（起始為綠色）
	    emissiveIntensity: 3  // 發光強度，配合 Bloom 效果更佳
	});

	target.traverse((child) => {
        // 只計算有幾何體且可見的網格 (Mesh)
        if (child.isMesh) {
            child.material=keyMaterial;

        }
    });
}

function InstEmissiveWords(target,thisColor)
{
	const keyMaterial = new THREE.MeshStandardMaterial({
	    color: thisColor,       // 鍵帽本體顏色（深色）
	    emissive: thisColor,    // 發光顏色（起始為綠色）
	    emissiveIntensity: 0.2,  // 發光強度，配合 Bloom 效果更佳
	});

	//target.traverse((child) => {
    //    // 只計算有幾何體且可見的網格 (Mesh)
    //    if (child.isMesh) {
    //        child.material=keyMaterial;
    //    }
    //});

	FX.ReturnBufferGeometry(target,keyMaterial,null,scene);
}

///==================== 太空場景：綠色輪廓光 ====================
function AddRimLight(model)
{
	const box = new THREE.Box3().setFromObject(model);
	const size = box.getSize(new THREE.Vector3());
	const center = box.getCenter(new THREE.Vector3());
	const span = Math.max(size.x, size.z);

	///放在預設鏡頭視線的後上方，勾出鍵盤外框輪廓（呼應背景行星的綠色大氣光）
	const viewDir = new THREE.Vector3().subVectors(ControlsTargetDefaultPos, CameraDefaultPos).setY(0).normalize();
	const rimLight = new THREE.DirectionalLight(SPACE.neon, SPACE.rimIntensity);
	rimLight.position.copy(center).addScaledVector(viewDir, span * 2).add(new THREE.Vector3(0, span * 0.8, 0));
	rimLight.target.position.copy(center);
	scene.add(rimLight);
	scene.add(rimLight.target);
}

///==================== 太空場景：行星背景（2D Canvas） ====================
function DrawSpaceBackdrop()
{
	const cvs = document.getElementById('spaceBackdrop');
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const W = Math.round(window.innerWidth * dpr);
	const H = Math.round(window.innerHeight * dpr);
	cvs.width = W; cvs.height = H;
	const ctx = cvs.getContext('2d');

	///---- noise 工具 ----
	const hash = (x, y) => {
		let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
		h = Math.imul(h ^ (h >>> 13), 1274126177);
		return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
	};
	const vnoise = (x, y) => {
		const xi = Math.floor(x), yi = Math.floor(y);
		const xf = x - xi, yf = y - yi;
		const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
		const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
		return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
	};
	const fbm = (x, y, oct) => {
		let s = 0, amp = 0.5, f = 1;
		for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
		return s;
	};
	let seed = 7;
	const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

	///---- 底色 ----
	ctx.fillStyle = '#000';
	ctx.fillRect(0, 0, W, H);

	//行星位置與大小（參考圖構圖：左側巨大行星，下緣延伸出畫面）
	const portrait = W < H;
	const pr = portrait ? W * 0.72 : Math.max(W * 0.27, H * 0.58);
	const px = portrait ? W * 0.32 : W * 0.30;
	const py = portrait ? H * 0.70 : H * 0.80;
	const hazeY = H * 0.72;//右側綠色大氣散射的高度

	//右側綠色大氣散射
	let g = ctx.createRadialGradient(W * 0.80, hazeY, 0, W * 0.80, hazeY, W * 0.55);
	g.addColorStop(0, 'rgba(90,150,45,0.30)');
	g.addColorStop(0.45, 'rgba(40,80,25,0.14)');
	g.addColorStop(1, 'rgba(0,0,0,0)');
	ctx.fillStyle = g;
	ctx.fillRect(0, 0, W, H);

	///---- 星點 ----
	for (let i = 0; i < 320; i++)
	{
		const x = rand() * W, y = rand() * H;
		if (Math.hypot(x - px, y - py) < pr * 1.08) continue;
		ctx.fillStyle = `rgba(255,255,255,${0.08 + rand() * 0.45})`;
		ctx.beginPath();
		ctx.arc(x, y, (0.35 + rand() * 0.8) * dpr, 0, Math.PI * 2);
		ctx.fill();
	}

	///---- 行星表面（程序化紋理 + 背光照明） ----
	const N = Math.min(768, Math.round(pr * 2));
	const tex = document.createElement('canvas');
	tex.width = tex.height = N;
	const tctx = tex.getContext('2d');
	const img = tctx.createImageData(N, N);
	const L = (() => { const v = [0.62, -0.42, -0.66]; const m = Math.hypot(...v); return v.map(c => c / m); })();//光源：右上後方

	for (let j = 0; j < N; j++)
	{
		for (let i = 0; i < N; i++)
		{
			const nx = (i + 0.5) / N * 2 - 1;
			const ny = (j + 0.5) / N * 2 - 1;
			const r2 = nx * nx + ny * ny;
			const idx = (j * N + i) * 4;
			const edge = (1 - Math.sqrt(r2)) * N * 0.5;//距離邊緣的像素數，用於邊緣抗鋸齒
			if (edge <= 0) { img.data[idx + 3] = 0; continue; }

			const nz = Math.sqrt(1 - r2);
			const k = 1.8 / (0.35 + nz);
			const u = nx * k, v = ny * k;

			const detail = fbm(u * 2.2 + 11.3, v * 2.2 + 4.7, 5);
			const maria = Math.max(0, fbm(u * 0.7 + 3.1, v * 0.7 + 8.2, 3) - 0.45) * 2.2;
			let albedo = 0.22 + detail * 0.55 - maria * 0.18;

			const lam = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
			const ambient = 0.10 + 0.10 * Math.max(0, nx * 0.6 - ny * 0.8);//微弱的表面可見度
			const shade = ambient + lam * 1.1;

			const limb = Math.pow(1 - nz, 2.5);
			const rimDir = Math.max(0, (nx * L[0] + ny * L[1]) / Math.hypot(L[0], L[1]));
			const rim = limb * Math.pow(rimDir, 1.5);

			const base = albedo * shade * 255;
			img.data[idx]     = Math.min(255, base * 0.92 + rim * 60);
			img.data[idx + 1] = Math.min(255, base * 0.98 + rim * 140);
			img.data[idx + 2] = Math.min(255, base * 0.90 + rim * 35);
			img.data[idx + 3] = Math.round(255 * Math.min(1, edge / 1.5));
		}
	}
	tctx.putImageData(img, 0, 0);
	ctx.imageSmoothingQuality = 'high';
	ctx.drawImage(tex, px - pr, py - pr, pr * 2, pr * 2);

	///---- 大氣輪廓光（螢光綠，集中在右上側） ----
	const glowCanvas = document.createElement('canvas');
	glowCanvas.width = W; glowCanvas.height = H;
	const gctx = glowCanvas.getContext('2d');

	g = gctx.createRadialGradient(px, py, pr * 0.985, px, py, pr * 1.10);
	g.addColorStop(0, 'rgba(160,255,90,0)');
	g.addColorStop(0.12, 'rgba(200,255,130,0.85)');
	g.addColorStop(0.30, 'rgba(110,210,55,0.35)');
	g.addColorStop(1, 'rgba(60,140,30,0)');
	gctx.fillStyle = g;
	gctx.fillRect(0, 0, W, H);

	const peak = -0.35;//輪廓光最亮的角度（弧度，0 = 右方）
	if (gctx.createConicGradient)
	{
		const mask = gctx.createConicGradient(peak - Math.PI, px, py);
		mask.addColorStop(0.00, 'rgba(0,0,0,0)');
		mask.addColorStop(0.22, 'rgba(0,0,0,0.12)');
		mask.addColorStop(0.50, 'rgba(0,0,0,1)');
		mask.addColorStop(0.66, 'rgba(0,0,0,0.55)');
		mask.addColorStop(0.80, 'rgba(0,0,0,0.05)');
		mask.addColorStop(1.00, 'rgba(0,0,0,0)');
		gctx.globalCompositeOperation = 'destination-in';
		gctx.fillStyle = mask;
		gctx.fillRect(0, 0, W, H);
	}
	else
	{
		gctx.globalCompositeOperation = 'destination-in';
		gctx.fillStyle = 'rgba(0,0,0,0.35)';
		gctx.fillRect(0, 0, W, H);
	}
	ctx.globalCompositeOperation = 'lighter';
	ctx.drawImage(glowCanvas, 0, 0);
	ctx.globalCompositeOperation = 'source-over';

	///---- 右上角小衛星 ----
	const mx = W * 0.985, my = H * 0.025, mr = H * 0.07;
	g = ctx.createRadialGradient(mx - mr * 0.35, my + mr * 0.3, mr * 0.1, mx, my, mr);
	g.addColorStop(0, '#2a2d2a');
	g.addColorStop(1, '#0a0b0a');
	ctx.fillStyle = g;
	ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
	ctx.strokeStyle = 'rgba(150,170,150,0.25)';
	ctx.lineWidth = 1 * dpr;
	ctx.beginPath(); ctx.arc(mx, my, mr, Math.PI * 0.55, Math.PI * 1.05); ctx.stroke();

}
		</script>
    </body>
